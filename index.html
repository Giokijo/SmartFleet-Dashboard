<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFleet Condition Monitoring Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for Fast CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .badge-normal { background-color: #def7ec; color: #03543f; border: 1px solid #84e1bc; }
        .badge-caution { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .badge-critical { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
        .badge-nodata { background-color: #1e293b; color: #64748b; border: 1px dashed #334155; }
        .comp-cell { width: 180px; min-width: 180px; max-width: 180px; }

        /* Strict Scroll & Freeze Configuration */
        .table-container {
            max-height: 75vh;
            overflow-y: auto;
            overflow-x: auto;
            position: relative;
        }

        /* Freeze Component Headers on Vertical Scroll */
        thead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #020617 !important;
            box-shadow: inset 0 -1px 0 #1e293b;
        }

        /* Freeze Asset ID Column on Horizontal Scroll */
        .sticky-asset-col {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: #0f172a !important;
            box-shadow: inset -1px 0 0 #1e293b;
        }

        /* Intersecting Top-Left Corner Cell */
        thead th.sticky-asset-col {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 30;
            background-color: #020617 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-6 flex flex-col justify-between">

    <div>
        <!-- Header Section -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-2xl">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🚜</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">SmartFleet Dynamic Monitoring Dashboard</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Direct Health-Mapping Data Active</p>
                </div>
            </div>
            <div class="mt-4 md:mt-0 flex flex-wrap items-center gap-3">
                <span id="sync-status" class="text-xs text-emerald-400 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800">
                    Initializing Fast Load...
                </span>
                <button onclick="fetchAllData(true)" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-4 py-2 rounded-xl transition duration-200 shadow-md">
                    🔄 Sync Live CSV
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer font-semibold text-xs px-3 py-2 rounded-xl border border-slate-700 transition">
                    📁 Load CSV File
                    <input type="file" id="local-csv-file" accept=".csv" class="hidden" onchange="handleLocalFile(event)">
                </label>
            </div>
        </header>

        <!-- Controls & Model Filter Bar -->
        <div class="flex flex-wrap gap-4 mb-6 bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl items-center justify-between">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Filter Model:</label>
                <select id="model-filter" onchange="filterTable()" class="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2 outline-none focus:border-blue-500">
                    <option value="ALL">All Models</option>
                </select>
            </div>
            <div id="unit-counter" class="text-xs text-slate-400 font-medium">Processing records...</div>
        </div>

        <!-- Fleet Level Exceeded Summary Bar -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 mb-6 shadow-xl">
            <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">⚡ Fleet Status Exceeded (Sum per Component Assembly)</h2>
            <div id="sos-sum-bar" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-2 text-center text-xs">
                <!-- Dynamically populated component sum cells -->
            </div>
        </div>

        <!-- Main Matrix Table -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 bg-slate-900/90 flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Detailed Component Condition & Wear Elements</h3>
                <span class="text-[10px] text-slate-400">💡 Direct Source Status Mapping Active</span>
            </div>
            <div class="table-container">
                <table class="w-full text-left text-xs border-collapse">
                    <thead id="matrix-head" class="text-slate-400 uppercase text-[10px] tracking-wider">
                        <!-- Dynamic Headers -->
                    </thead>
                    <tbody id="matrix-body" class="divide-y divide-slate-800/80">
                        <tr><td id="status-cell" colspan="20" class="p-6 text-center text-slate-400">Loading dashboard...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Signature -->
    <footer class="text-center mt-10 mb-2">
        <p class="text-[11px] font-mono text-slate-500 tracking-wider">bdw@2026</p>
    </footer>

    <script>
        // Force refresh URL with cache-busting timestamp
        const mainUrlData = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrf2aRz_JTAfexbNCF70MOB8lhPxq91WgH2uHGK0xAKfZcCGRAFOUjXD6dy3iJwQ/pub?output=csv&t=" + new Date().getTime();

        let globalFleetData = [];
        let allUniqueComponents = new Set();
        let allUniqueModels = new Set();

        async function fetchWithTimeout(url, timeoutMs = 4000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.trim().length > 0) {
                        return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
                    }
                }
            } catch (e) {
                clearTimeout(timer);
            }
            const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await fetch(fallbackUrl);
            const text = await res.text();
            return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
        }

        async function fetchAllData(forceRefresh = true) {
            const statusEl = document.getElementById('sync-status');
            
            if (forceRefresh) {
                localStorage.removeItem('smartfleet_main_csv');
            }

            statusEl.innerText = 'Syncing Live CSV...';
            statusEl.className = 'text-xs text-amber-400 bg-amber-950/80 px-3 py-1.5 rounded-lg border border-amber-800 animate-pulse';

            try {
                const mainRes = await fetchWithTimeout(mainUrlData);
                if (mainRes && mainRes.length > 0) {
                    processRawRows(mainRes);
                    localStorage.setItem('smartfleet_main_csv', JSON.stringify(mainRes));
                    statusEl.innerText = '✓ Live CSV Synced';
                    statusEl.className = 'text-xs text-emerald-400 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800';
                }
            } catch (err) {
                console.warn("Live fetch error:", err);
                const cachedMain = localStorage.getItem('smartfleet_main_csv');
                if (cachedMain) {
                    processRawRows(JSON.parse(cachedMain));
                    statusEl.innerText = '✓ Loaded Offline Cache';
                    statusEl.className = 'text-xs text-emerald-400 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800';
                }
            }
        }

        function handleLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processRawRows(results.data);
                        const statusEl = document.getElementById('sync-status');
                        statusEl.innerText = '✓ Local File Loaded';
                        statusEl.className = 'text-xs text-emerald-400 bg-emerald-950/80 px-3 py-1.5 rounded-lg border border-emerald-800';
                    }
                }
            });
        }

        function getAiRecommendation(elements, status) {
            if (!elements || elements === '-') return '-';
            let rec = `AI Rec: `;
            if (status === 'Critical') {
                rec += `Elements [${elements}] exceed critical thresholds. Schedule immediate component inspection & oil change!`;
            } else if (status === 'Caution') {
                rec += `Elements [${elements}] are elevated. Perform oil resampling and monitor closely.`;
            } else {
                rec += `Elements [${elements}] detected. Inspect filters and record wear trend.`;
            }
            return rec;
        }

        function parseWearElements(rawStr) {
            if (!rawStr || rawStr.trim() === '' || rawStr.includes('#N/A')) return '-';
            const validElements = ['CU', 'FE', 'CR', 'PB', 'SN', 'SI', 'AL', 'MO', 'NI', 'AG', 'B', 'NA', 'K', 'V', 'ZN'];
            let parts = rawStr.split(',')
                .map(s => s.trim().toUpperCase())
                .filter(s => validElements.includes(s));
            return parts.length > 0 ? parts.join(', ') : '-';
        }

        function processRawRows(rows) {
            if (!rows || rows.length === 0) return;

            const keys = Object.keys(rows[0]);

            // Precise Column Key Mapping
            const assetKey = keys.find(k => k.trim().toLowerCase() === 'asset id') || keys.find(k => /unit|asset|equipment|serial|no|id/i.test(k)) || keys[0];
            const modelKey = keys.find(k => k.trim().toLowerCase() === 'model') || keys.find(k => /model|type|family|machine/i.test(k));
            const componentKey = keys.find(k => k.trim().toLowerCase() === 'component') || keys.find(k => /component|komponen|assembly|system|part/i.test(k));
            
            // Explicitly match "Oil Summary Health" column Q
            const statusKey = keys.find(k => k.trim().toLowerCase() === 'oil summary health') || keys.find(k => /health|summary|status|rating|kondisi/i.test(k));
            const meterKey = keys.find(k => k.trim().toLowerCase() === 'comp life') || keys.find(k => /comp life|smu|meter|hours|jam|life/i.test(k));
            const elementOverKey = keys.find(k => k.trim().toLowerCase() === 'element over') || keys.find(k => /element.*over|over.*element/i.test(k));

            let unitMap = {};
            allUniqueComponents.clear();
            allUniqueModels.clear();

            rows.forEach(r => {
                let unit = r[assetKey] || '';
                let comp = componentKey ? (r[componentKey] || '') : 'GENERAL';
                if (!unit) return;

                unit = unit.toString().trim();
                comp = comp.toString().trim().toUpperCase();
                
                let modelVal = modelKey && r[modelKey] ? r[modelKey].toString().trim() : 'ALL MODELS';
                if (modelVal) allUniqueModels.add(modelVal);

                allUniqueComponents.add(comp);

                if (!unitMap[unit]) {
                    unitMap[unit] = {
                        assetId: unit,
                        model: modelVal,
                        components: {}
                    };
                }

                let rawStatus = statusKey && r[statusKey] ? r[statusKey].toString().trim() : 'Normal';
                let rawMeter = meterKey && r[meterKey] ? r[meterKey].toString().trim() : '-';

                // Strict Status Determination
                let status = "Normal";
                let stUpper = rawStatus.toUpperCase();

                if (stUpper.includes("CRITICAL") || stUpper === "C" || stUpper.includes("PARAH")) {
                    status = "Critical";
                } else if (stUpper.includes("CAUTION") || stUpper === "B" || stUpper.includes("MONITOR") || stUpper.includes("WASPADA")) {
                    status = "Caution";
                } else if (stUpper.includes("NORMAL") || stUpper === "N" || stUpper === "A") {
                    status = "Normal";
                } else if (rawStatus !== "") {
                    status = rawStatus;
                }

                let rawElementVal = elementOverKey && r[elementOverKey] ? r[elementOverKey].toString().trim() : '';
                let cleanElements = parseWearElements(rawElementVal);
                let aiRec = getAiRecommendation(cleanElements, status);

                unitMap[unit].components[comp] = {
                    status: status,
                    life: rawMeter !== '-' ? rawMeter + (isNaN(rawMeter) ? '' : ' hrs') : '-',
                    elements: cleanElements,
                    recommendation: aiRec
                };
            });

            globalFleetData = Object.values(unitMap);
            buildMatrixUI(globalFleetData);
        }

        function buildMatrixUI(data) {
            const select = document.getElementById('model-filter');
            select.innerHTML = '<option value="ALL">All Models</option>';
            
            Array.from(allUniqueModels).sort().forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                select.appendChild(opt);
            });

            renderTable(data);
        }

        function filterTable() {
            const selectedModel = document.getElementById('model-filter').value;
            const filtered = selectedModel === 'ALL' ? globalFleetData : globalFleetData.filter(d => d.model === selectedModel);
            renderTable(filtered);
        }

        function renderTable(data) {
            const compList = Array.from(allUniqueComponents).sort();

            const head = document.getElementById('matrix-head');
            let headHTML = `<tr>
                <th class="p-3 text-blue-200 font-extrabold text-xs border-r border-slate-800 w-36 min-w-[144px] sticky-asset-col">➔ Asset ID / Model</th>`;
            compList.forEach(c => {
                headHTML += `<th class="p-3 border-r border-slate-800 comp-cell text-center">${c}</th>`;
            });
            headHTML += `</tr>`;
            head.innerHTML = headHTML;

            const body = document.getElementById('matrix-body');
            body.innerHTML = '';

            let sosSum = {};
            compList.forEach(c => sosSum[c] = 0);

            data.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition duration-150 border-b border-slate-800/60";

                let rowHTML = `
                    <td class="p-3 font-extrabold text-white text-sm tracking-wide border-r border-blue-900/60 w-36 min-w-[144px] sticky-asset-col">
                        <div>${row.assetId}</div>
                        <div class="text-[10px] font-normal text-blue-300 opacity-80">${row.model}</div>
                    </td>
                `;

                compList.forEach(comp => {
                    let compData = row.components[comp];
                    if (compData) {
                        let stLower = compData.status.toLowerCase();
                        if (stLower.includes('caution') || stLower.includes('critical') || stLower.includes('monitor')) {
                            sosSum[comp]++;
                        }

                        let badgeClass = 'badge-normal';
                        if (stLower.includes('critical')) badgeClass = 'badge-critical';
                        else if (stLower.includes('caution') || stLower.includes('monitor')) badgeClass = 'badge-caution';
                        
                        let elementDisplay = (compData.elements && compData.elements !== '-') 
                            ? `<div class="mt-1 bg-rose-950/60 border border-rose-800/80 rounded px-1.5 py-1 text-[9px]">
                                 <span class="font-extrabold text-rose-300 block">⚠️ ${compData.elements}</span>
                                 <span class="text-[8px] text-slate-300 block mt-0.5 leading-tight">${compData.recommendation}</span>
                               </div>` 
                            : `<div class="mt-1 text-[9px] text-slate-400 text-center">-</div>`;

                        rowHTML += `
                            <td class="p-2.5 border-r border-slate-800/80 comp-cell align-top">
                                <div class="px-2 py-2 rounded-lg text-[10px] ${badgeClass} font-semibold flex flex-col justify-between shadow-sm min-h-[75px]">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold">${compData.status}</span>
                                        <span class="text-[9px] font-extrabold text-amber-900 bg-amber-200/80 px-1 rounded">${compData.life}</span>
                                    </div>
                                    ${elementDisplay}
                                </div>
                            </td>
                        `;
                    } else {
                        rowHTML += `
                            <td class="p-2.5 border-r border-slate-800/80 comp-cell align-top">
                                <div class="px-2 py-2 rounded-lg text-[10px] badge-nodata font-semibold flex flex-col justify-between min-h-[75px] shadow-sm">
                                    <span class="text-[9px] text-slate-500">N/A</span>
                                </div>
                            </td>
                        `;
                    }
                });

                tr.innerHTML = rowHTML;
                body.appendChild(tr);
            });

            document.getElementById('unit-counter').innerText = `Showing ${data.length} Fleet Units`;

            const bar = document.getElementById('sos-sum-bar');
            bar.className = `grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-${Math.min(compList.length || 1, 12)} gap-2 text-center text-xs`;
            let barHTML = '';
            compList.forEach(c => {
                barHTML += `<div class="bg-slate-800 p-2 rounded-lg border border-slate-700"><span class="text-slate-400 block text-[9px] truncate">${c}</span><span class="text-sm font-bold text-amber-400">${sosSum[c]}</span></div>`;
            });
            bar.innerHTML = barHTML;
        }

        // Run with force refresh active on load
        fetchAllData(true);
    </script>
</body>
</html>
